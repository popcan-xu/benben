# T2 异地备份接收端（独立服务）的 Nginx 反代片段
# 用途：把公网路径 /benben/backup_webhook/ 反代到本机 receiver（127.0.0.1:8731）
# 部署方式：将本文件内容插入 benben 的 HTTPS server 块（benben_ssl.conf），
# 放在 Django 的 `location /` 之前即可。receiver 本身只监听 127.0.0.1，
# 公网暴露完全依赖此反代 + benben 既有 TLS。
    # ---- T2 备份接收端（独立服务，与 benben 应用解耦）----
    location /benben/backup_webhook/ {
        proxy_pass http://127.0.0.1:8731;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
